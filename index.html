<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parmassë</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="main.js"></script>
</head>

<body>
    <h1>
        Welcome to the Palaneum
    </h1>

    <main>
        <div class="top">
            <div class="purpose">
                <h3>Books you have read</h3>
                <button class="show-modal">Add New</button>
            </div>

            <div class="read">
                <div class="book-card">
                    <img src="assets/image/the-hobbit.jpg" class="image">
                    <h4>The Hobbit</h4>
                    <p>J.R.R. Tolkien</p>
                    <p>294 Pages</p>
                </div>
            </div>
        </div>

        <div class="bottom">
            <div class="purpose">
                <h3>Books you want to read</h3>
                <button class="show-modal">Add New</button>
            </div>

            <div class="to-read">

            </div>
        </div>
    </main>

    <dialog id="modal">
        <h2>Add a new book</h2>

        <form name="addBook">
            <div class="form-row">
                <label for="title">Title</label>
                <input type="text" id="title" required/>
            </div>

            <div class="form-row">
                <label for="author">Author</label>
                <input type="text" id="author" required/>
            </div>

            <div class="form-row">
                <label for="pages">Pages</label>
                <input type="number" name="pages" id="pages"required>
            </div>

            <div class="form-row">
                <label for="status">Status</label>
                <select name="status" id="status" required>
                    <option value="read">Read</option>
                    <option value="reading">Reading</option>
                    <option value="toRead">To Read</option>
                </select>
            </div>

            <div class="form-row">
                <label for="image">Image</label>
                <input type="file" name="image" id="image" accept="image/*" required>
            </div>

            <div class="form-row btn">
                <button type="submit" id="submit">Add Book</button>
            </div>
        </form>
    </dialog>

    <hr>
    <footer>
        <p>Located In: Khabranth, The city of Bells</p>
        <p>&copy; Me, 2026</p>
    </footer>
    <hr>
</body>

</html>
