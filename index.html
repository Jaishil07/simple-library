<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parmassë</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="main.js"></script>
</head>

<body>
    <h1>
        Welcome to the Palaneum
    </h1>

    <main>
        <div class="top">
            <div class="purpose">
                <h3>Books you have read</h3>
                <button>Add New</button>
            </div>

            <div class="read">
                <div class="book-card"></div>
                <div class="book-card"></div>
                <div class="book-card"></div>
            </div>
        </div>

        <div class="bottom">
            <div class="purpose">
                <h3>Books you want to read</h3>
                <button>Add New</button>
            </div>

            <div class="to-read">
                <div class="book-card"></div>
                <div class="book-card"></div>
                <div class="book-card"></div>
            </div>
        </div>
    </main>
</body>

</html>
